[project]
name = "northstar-analytics"
version = "1.0.0"
description = "End-to-end e-commerce analytics pipeline and dashboard on DuckDB"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=16.0.0",
    "streamlit>=1.39.0",
    "plotly>=5.22.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "app"]

[tool.setuptools.packages.find]
include = ["analytics*"]
