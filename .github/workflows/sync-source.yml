name: sync-source

on:
  push:
    paths:
      - .github/workflows/sync-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stop if already synced
        run: |
          if [ ! -f .github/workflows/sync-source.yml ]; then
            echo "already synced"; exit 0
          fi
      - name: Fetch project source
        run: curl -fsSL -o /tmp/northstar.tar.gz https://site-f412e4a78b524b61a04e5689c2054a73.freebuff.page/source.tar.gz
      - name: Extract
        run: tar -xzf /tmp/northstar.tar.gz -C .
      - name: Commit source and retire this workflow
        run: |
          git config user.name "northstar-sync"
          git config user.email "northstar-sync@users.noreply.github.com"
          git rm -q .github/workflows/sync-source.yml
          git add -A
          git commit -m "Add analytics source, dashboard pages and test suite"
          git push
